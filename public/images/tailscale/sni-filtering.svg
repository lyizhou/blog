<svg width="700" height="380" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'Fira Code', monospace">
  <defs>
    <marker id="redArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="380" fill="#0f1117" rx="14"/>
  <rect width="700" height="380" fill="none" stroke="#1e2433" stroke-width="1" rx="14"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" fill="#94a3b8" font-size="12" letter-spacing="2">ISP SNI 过滤机制</text>

  <!-- ===== BEFORE section ===== -->
  <rect x="16" y="46" width="668" height="148" fill="#1a0a0a" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3" rx="8"/>
  <rect x="16" y="46" width="120" height="22" fill="#ef4444" fill-opacity="0.7" rx="4"/>
  <text x="76" y="61" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">方案一：域名 TLS（失败）</text>

  <!-- Client -->
  <rect x="28" y="82" width="90" height="50" fill="#161b27" stroke="#475569" stroke-width="1" rx="6"/>
  <text x="73" y="103" text-anchor="middle" fill="#94a3b8" font-size="11">客户端</text>
  <text x="73" y="120" text-anchor="middle" fill="#64748b" font-size="9">tailscaled</text>

  <!-- TLS Hello packet (bad) -->
  <rect x="148" y="84" width="180" height="46" fill="#2d1515" stroke="#ef4444" stroke-width="1" rx="6"/>
  <text x="238" y="103" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="bold">TLS Client Hello</text>
  <text x="238" y="119" text-anchor="middle" fill="#fca5a5" font-size="10">SNI = opentrading.tech</text>

  <!-- Arrow client → packet -->
  <line x1="118" y1="107" x2="146" y2="107" stroke="#ef4444" stroke-width="1.5" marker-end="url(#redArrow)"/>

  <!-- ISP box -->
  <rect x="352" y="74" width="88" height="66" fill="#2d1515" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="396" y="99" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="bold">运营商</text>
  <text x="396" y="115" text-anchor="middle" fill="#fca5a5" font-size="10">DPI 检测</text>
  <text x="396" y="130" text-anchor="middle" fill="#fca5a5" font-size="9">SNI 黑名单</text>

  <!-- Arrow packet → ISP -->
  <line x1="328" y1="107" x2="350" y2="107" stroke="#ef4444" stroke-width="1.5" marker-end="url(#redArrow)"/>

  <!-- Block symbol -->
  <circle cx="510" cy="107" r="26" fill="#2d1515" stroke="#ef4444" stroke-width="2"/>
  <line x1="491" y1="88" x2="529" y2="126" stroke="#ef4444" stroke-width="3"/>
  <line x1="529" y1="88" x2="491" y2="126" stroke="#ef4444" stroke-width="3"/>

  <!-- Arrow ISP → block -->
  <line x1="440" y1="107" x2="482" y2="107" stroke="#ef4444" stroke-width="1.5" marker-end="url(#redArrow)"/>

  <!-- Error label -->
  <text x="560" y="100" fill="#ef4444" font-size="10">SSL_ERROR</text>
  <text x="560" y="115" fill="#ef4444" font-size="10">_SYSCALL</text>
  <text x="560" y="133" fill="#64748b" font-size="9">连接被丢弃</text>

  <!-- Result label -->
  <text x="350" y="172" text-anchor="middle" fill="#ef4444" font-size="11">非 ICP 备案域名的 TLS SNI → 中国 ISP 直接丢包</text>

  <!-- ===== AFTER section ===== -->
  <rect x="16" y="210" width="668" height="152" fill="#091a12" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3" rx="8"/>
  <rect x="16" y="210" width="120" height="22" fill="#10b981" fill-opacity="0.7" rx="4"/>
  <text x="76" y="225" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">方案二：IP 自签证书（成功）</text>

  <!-- Client -->
  <rect x="28" y="246" width="90" height="50" fill="#161b27" stroke="#475569" stroke-width="1" rx="6"/>
  <text x="73" y="267" text-anchor="middle" fill="#94a3b8" font-size="11">客户端</text>
  <text x="73" y="284" text-anchor="middle" fill="#64748b" font-size="9">tailscaled</text>

  <!-- TLS Hello packet (good) -->
  <rect x="148" y="248" width="180" height="46" fill="#091f14" stroke="#10b981" stroke-width="1" rx="6"/>
  <text x="238" y="267" text-anchor="middle" fill="#10b981" font-size="10" font-weight="bold">TLS Client Hello</text>
  <text x="238" y="283" text-anchor="middle" fill="#86efac" font-size="10">SNI = (IP 地址，无域名)</text>

  <!-- Arrow client → packet -->
  <line x1="118" y1="271" x2="146" y2="271" stroke="#10b981" stroke-width="1.5" marker-end="url(#greenArrow)"/>

  <!-- ISP box (pass) -->
  <rect x="352" y="238" width="88" height="66" fill="#0d1f14" stroke="#10b981" stroke-width="1.5" rx="6"/>
  <text x="396" y="263" text-anchor="middle" fill="#10b981" font-size="11" font-weight="bold">运营商</text>
  <text x="396" y="279" text-anchor="middle" fill="#86efac" font-size="10">DPI 检测</text>
  <text x="396" y="294" text-anchor="middle" fill="#86efac" font-size="9">无域名 → 放行</text>

  <!-- Arrow packet → ISP -->
  <line x1="328" y1="271" x2="350" y2="271" stroke="#10b981" stroke-width="1.5" marker-end="url(#greenArrow)"/>

  <!-- Server box -->
  <rect x="460" y="238" width="100" height="66" fill="#091f14" stroke="#10b981" stroke-width="1.5" rx="6"/>
  <text x="510" y="263" text-anchor="middle" fill="#10b981" font-size="11" font-weight="bold">阿里云</text>
  <text x="510" y="279" text-anchor="middle" fill="#86efac" font-size="10">DERP Server</text>
  <text x="510" y="295" text-anchor="middle" fill="#64748b" font-size="9">IP 证书验证 ✓</text>

  <!-- Arrow ISP → server -->
  <line x1="440" y1="271" x2="458" y2="271" stroke="#10b981" stroke-width="1.5" marker-end="url(#greenArrow)"/>

  <!-- sha256 cert label -->
  <text x="580" y="255" fill="#f59e0b" font-size="9">sha256-raw:</text>
  <text x="580" y="268" fill="#f59e0b" font-size="9">CertName pin</text>

  <!-- Result label -->
  <text x="350" y="340" text-anchor="middle" fill="#10b981" font-size="11">IP 地址直连 → TLS 无 SNI → ISP 不过滤 → 正常建立加密隧道</text>

  <!-- Key command -->
  <rect x="60" y="352" width="580" height="20" fill="#161b27" rx="4"/>
  <text x="350" y="366" text-anchor="middle" fill="#64748b" font-size="10">openssl req -x509 -newkey ec ... -subj "/CN=8.138.151.75" -addext "subjectAltName=IP:8.138.151.75"</text>
</svg>
