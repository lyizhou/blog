<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Chart area fill -->
  <path d="M16,90 L38,68 L58,76 L80,44 L102,52 L112,36 L112,104 L16,104 Z"
        fill="#0284c7" opacity="0.15"/>

  <!-- Chart line -->
  <polyline points="16,90 38,68 58,76 80,44 102,52 112,36"
            fill="none" stroke="url(#line)" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Highlight dot at peak -->
  <circle cx="80" cy="44" r="6" fill="#38bdf8"/>
</svg>
