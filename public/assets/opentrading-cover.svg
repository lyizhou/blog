<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Fira Code',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0c1a2e"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="greenLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.6">
    <line x1="60" y1="80"  x2="760" y2="80"/>
    <line x1="60" y1="160" x2="760" y2="160"/>
    <line x1="60" y1="240" x2="760" y2="240"/>
    <line x1="60" y1="320" x2="760" y2="320"/>
    <line x1="60" y1="400" x2="760" y2="400"/>
    <line x1="60"  y1="80" x2="60"  y2="420"/>
    <line x1="200" y1="80" x2="200" y2="420"/>
    <line x1="340" y1="80" x2="340" y2="420"/>
    <line x1="480" y1="80" x2="480" y2="420"/>
    <line x1="620" y1="80" x2="620" y2="420"/>
    <line x1="760" y1="80" x2="760" y2="420"/>
  </g>

  <!-- Area fill under main line -->
  <path d="M60,310 C100,290 130,260 170,220 C210,180 240,200 280,170 C320,140 350,155 390,130 C430,105 460,120 500,100 C540,80 570,110 610,115 C650,120 680,108 720,95 L760,88 L760,420 L60,420 Z"
        fill="url(#areaGrad)"/>

  <!-- Main price line -->
  <path d="M60,310 C100,290 130,260 170,220 C210,180 240,200 280,170 C320,140 350,155 390,130 C430,105 460,120 500,100 C540,80 570,110 610,115 C650,120 680,108 720,95 L760,88"
        fill="none" stroke="url(#lineGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Secondary signal line -->
  <path d="M60,340 C100,335 140,320 180,330 C220,340 250,310 290,295 C330,280 360,270 400,255 C440,240 470,258 510,245 C550,232 580,240 620,228 C660,216 690,220 730,210 L760,205"
        fill="none" stroke="url(#greenLine)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Candle sticks (decorative) -->
  <g opacity="0.7">
    <rect x="72"  y="295" width="8" height="28" fill="#ef4444" rx="1"/>
    <line x1="76" y1="290" x2="76" y2="326" stroke="#ef4444" stroke-width="1"/>

    <rect x="92"  y="272" width="8" height="22" fill="#10b981" rx="1"/>
    <line x1="96" y1="268" x2="96" y2="296" stroke="#10b981" stroke-width="1"/>

    <rect x="112" y="258" width="8" height="20" fill="#10b981" rx="1"/>
    <line x1="116" y1="252" x2="116" y2="280" stroke="#10b981" stroke-width="1"/>

    <rect x="132" y="265" width="8" height="18" fill="#ef4444" rx="1"/>
    <line x1="136" y1="260" x2="136" y2="286" stroke="#ef4444" stroke-width="1"/>

    <rect x="152" y="238" width="8" height="24" fill="#10b981" rx="1"/>
    <line x1="156" y1="233" x2="156" y2="264" stroke="#10b981" stroke-width="1"/>
  </g>

  <!-- Volume bars at bottom -->
  <g opacity="0.3">
    <rect x="62"  y="395" width="10" height="18" fill="#ef4444" rx="1"/>
    <rect x="78"  y="390" width="10" height="23" fill="#10b981" rx="1"/>
    <rect x="94"  y="393" width="10" height="20" fill="#10b981" rx="1"/>
    <rect x="110" y="388" width="10" height="25" fill="#ef4444" rx="1"/>
    <rect x="126" y="391" width="10" height="22" fill="#10b981" rx="1"/>
    <rect x="142" y="386" width="10" height="27" fill="#10b981" rx="1"/>
    <rect x="158" y="394" width="10" height="19" fill="#ef4444" rx="1"/>
    <rect x="174" y="389" width="10" height="24" fill="#10b981" rx="1"/>
    <rect x="190" y="392" width="10" height="21" fill="#10b981" rx="1"/>
    <rect x="206" y="385" width="10" height="28" fill="#10b981" rx="1"/>
    <rect x="222" y="393" width="10" height="20" fill="#ef4444" rx="1"/>
    <rect x="238" y="387" width="10" height="26" fill="#10b981" rx="1"/>
  </g>

  <!-- Y-axis labels -->
  <g fill="#475569" font-size="11">
    <text x="50" y="84"  text-anchor="end">+8%</text>
    <text x="50" y="164" text-anchor="end">+4%</text>
    <text x="50" y="244" text-anchor="end">0%</text>
    <text x="50" y="324" text-anchor="end">-4%</text>
    <text x="50" y="404" text-anchor="end">-8%</text>
  </g>

  <!-- Highlight dot on line -->
  <circle cx="500" cy="100" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="500" cy="100" r="9" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

  <!-- Tooltip -->
  <rect x="510" y="72" width="130" height="50" fill="#0f1f35" stroke="#0284c7" stroke-width="1" rx="6"/>
  <text x="520" y="90"  fill="#94a3b8" font-size="10">信号强度</text>
  <text x="520" y="108" fill="#38bdf8" font-size="13" font-weight="bold">+3.42%  ↑</text>
  <text x="600" y="108" fill="#64748b" font-size="10">多头</text>

  <!-- Title area -->
  <text x="60" y="46" fill="#38bdf8" font-size="22" font-weight="bold" letter-spacing="1">OpenTrading</text>
  <text x="240" y="46" fill="#475569" font-size="13">· 量化交易基础设施</text>

  <!-- Tags -->
  <rect x="60" y="455" width="70" height="20" fill="#0c2a3d" stroke="#0284c7" stroke-width="1" rx="10"/>
  <text x="95" y="469" text-anchor="middle" fill="#38bdf8" font-size="10">Python</text>

  <rect x="140" y="455" width="70" height="20" fill="#0c2a3d" stroke="#0284c7" stroke-width="1" rx="10"/>
  <text x="175" y="469" text-anchor="middle" fill="#38bdf8" font-size="10">量化策略</text>

  <rect x="220" y="455" width="70" height="20" fill="#0c2a3d" stroke="#0284c7" stroke-width="1" rx="10"/>
  <text x="255" y="469" text-anchor="middle" fill="#38bdf8" font-size="10">实盘执行</text>

  <rect x="300" y="455" width="70" height="20" fill="#0c2a3d" stroke="#0284c7" stroke-width="1" rx="10"/>
  <text x="335" y="469" text-anchor="middle" fill="#38bdf8" font-size="10">AI 分析</text>
</svg>
