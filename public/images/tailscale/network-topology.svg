<svg width="700" height="320" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'Fira Code', monospace">
  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="320" fill="#0f1117" rx="14"/>
  <rect width="700" height="320" fill="none" stroke="#1e2433" stroke-width="1" rx="14"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" fill="#94a3b8" font-size="12" letter-spacing="2">TAILSCALE DERP 中继架构</text>

  <!-- ===== Mac Node ===== -->
  <rect x="24" y="110" width="138" height="90" fill="#161b27" stroke="#6366f1" stroke-width="1.5" rx="10"/>
  <rect x="24" y="110" width="138" height="28" fill="#6366f1" fill-opacity="0.2" rx="10"/>
  <rect x="24" y="128" width="138" height="10" fill="#6366f1" fill-opacity="0.2"/>
  <text x="93" y="129" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="bold">Mac Mini</text>
  <text x="93" y="152" text-anchor="middle" fill="#64748b" font-size="10">广东家宽</text>
  <text x="93" y="170" text-anchor="middle" fill="#64748b" font-size="10">IPv4 only · CGNAT</text>
  <text x="93" y="188" text-anchor="middle" fill="#6366f1" font-size="10">tailscaled</text>

  <!-- ===== DERP Relay Node ===== -->
  <rect x="266" y="85" width="168" height="130" fill="#161b27" stroke="#10b981" stroke-width="1.5" rx="10" filter="url(#glow)"/>
  <rect x="266" y="85" width="168" height="30" fill="#10b981" fill-opacity="0.15" rx="10"/>
  <rect x="266" y="105" width="168" height="10" fill="#10b981" fill-opacity="0.15"/>
  <text x="350" y="106" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">DERP Relay</text>
  <text x="350" y="126" text-anchor="middle" fill="#e2e8f0" font-size="11">阿里云深圳</text>
  <text x="350" y="144" text-anchor="middle" fill="#64748b" font-size="10">x.x.x.x : 8443</text>
  <text x="350" y="162" text-anchor="middle" fill="#64748b" font-size="10">TLS · IP 自签证书</text>
  <text x="350" y="180" text-anchor="middle" fill="#f59e0b" font-size="10">无 SNI → 绕过 ISP 过滤</text>
  <text x="350" y="198" text-anchor="middle" fill="#64748b" font-size="10">STUN : 3478</text>

  <!-- ===== iPad Node ===== -->
  <rect x="538" y="68" width="138" height="80" fill="#161b27" stroke="#6366f1" stroke-width="1.5" rx="10"/>
  <rect x="538" y="68" width="138" height="26" fill="#6366f1" fill-opacity="0.2" rx="10"/>
  <rect x="538" y="84" width="138" height="10" fill="#6366f1" fill-opacity="0.2"/>
  <text x="607" y="85" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="bold">iPad</text>
  <text x="607" y="106" text-anchor="middle" fill="#64748b" font-size="10">广东 · 蜂窝/WiFi</text>
  <text x="607" y="123" text-anchor="middle" fill="#6366f1" font-size="10">tailscaled</text>
  <text x="607" y="141" text-anchor="middle" fill="#34d399" font-size="10">~21ms to DERP</text>

  <!-- ===== Windows Node ===== -->
  <rect x="538" y="180" width="138" height="80" fill="#161b27" stroke="#6366f1" stroke-width="1.5" rx="10"/>
  <rect x="538" y="180" width="138" height="26" fill="#6366f1" fill-opacity="0.2" rx="10"/>
  <rect x="538" y="196" width="138" height="10" fill="#6366f1" fill-opacity="0.2"/>
  <text x="607" y="197" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="bold">Windows</text>
  <text x="607" y="218" text-anchor="middle" fill="#64748b" font-size="10">广东 · 手机热点</text>
  <text x="607" y="235" text-anchor="middle" fill="#64748b" font-size="10">IPv4 + IPv6</text>
  <text x="607" y="253" text-anchor="middle" fill="#34d399" font-size="10">~21ms to DERP</text>

  <!-- Mac → DERP arrow -->
  <line x1="163" y1="152" x2="264" y2="148" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <rect x="186" y="133" width="58" height="18" fill="#0f1117" rx="4"/>
  <text x="215" y="146" text-anchor="middle" fill="#10b981" font-size="11" font-weight="bold">12 ms</text>

  <!-- DERP → iPad arrow -->
  <line x1="434" y1="130" x2="536" y2="108" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <rect x="460" y="100" width="50" height="18" fill="#0f1117" rx="4"/>
  <text x="485" y="113" text-anchor="middle" fill="#10b981" font-size="11" font-weight="bold">~21ms</text>

  <!-- DERP → Windows arrow -->
  <line x1="434" y1="170" x2="536" y2="212" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <rect x="460" y="196" width="50" height="18" fill="#0f1117" rx="4"/>
  <text x="485" y="209" text-anchor="middle" fill="#10b981" font-size="11" font-weight="bold">~21ms</text>

  <!-- Total latency badge -->
  <rect x="210" y="272" width="280" height="34" fill="#161b27" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
  <text x="350" y="285" text-anchor="middle" fill="#94a3b8" font-size="11">Mac ↔ Windows 端到端延迟</text>
  <text x="350" y="300" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">≈ 34 ms</text>
</svg>
