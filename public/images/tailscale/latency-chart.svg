<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'Fira Code', monospace">
  <defs>
    <linearGradient id="barRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="barOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="300" fill="#0f1117" rx="14"/>
  <rect width="700" height="300" fill="none" stroke="#1e2433" stroke-width="1" rx="14"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" fill="#94a3b8" font-size="12" letter-spacing="2">延迟优化对比（Mac ↔ Windows RTT）</text>

  <!-- Grid lines -->
  <line x1="180" y1="55" x2="180" y2="245" stroke="#1e2433" stroke-width="1"/>
  <line x1="180" y1="245" x2="660" y2="245" stroke="#1e2433" stroke-width="1"/>

  <!-- Grid vertical tick marks -->
  <!-- 0ms -->
  <text x="174" y="249" text-anchor="end" fill="#475569" font-size="10">0</text>
  <!-- 200ms -->
  <line x1="180" y1="189" x2="660" y2="189" stroke="#1e2433" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="174" y="193" text-anchor="end" fill="#475569" font-size="10">200</text>
  <!-- 400ms -->
  <line x1="180" y1="133" x2="660" y2="133" stroke="#1e2433" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="174" y="137" text-anchor="end" fill="#475569" font-size="10">400</text>
  <!-- 600ms -->
  <line x1="180" y1="77" x2="660" y2="77" stroke="#1e2433" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="174" y="81" text-anchor="end" fill="#475569" font-size="10">600</text>
  <!-- ms label -->
  <text x="118" y="155" text-anchor="middle" fill="#64748b" font-size="10" transform="rotate(-90, 118, 155)">延迟 (ms)</text>

  <!-- Scale: 600ms = 168px height, so 1ms = 0.28px -->
  <!-- bar 1: Default DERP Toronto 700ms avg → 196px -->
  <rect x="216" y="69" width="100" height="176" fill="url(#barRed)" rx="4"/>
  <!-- Range indicator -->
  <line x1="266" y1="55" x2="266" y2="105" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="246" y1="55" x2="286" y2="55" stroke="#ef4444" stroke-width="1.5"/>  <!-- top of range 930ms but capped -->
  <line x1="246" y1="105" x2="286" y2="105" stroke="#ef4444" stroke-width="1.5"/>  <!-- 470ms -->
  <text x="266" y="62" text-anchor="middle" fill="#ef4444" font-size="9">930ms</text>

  <text x="266" y="263" text-anchor="middle" fill="#94a3b8" font-size="11">默认 DERP</text>
  <text x="266" y="277" text-anchor="middle" fill="#64748b" font-size="10">Toronto</text>
  <text x="266" y="59" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">470-930ms</text>

  <!-- bar 2: HK VPS 150ms avg → 42px -->
  <rect x="376" y="203" width="100" height="42" fill="url(#barOrange)" rx="4"/>
  <text x="426" y="199" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="bold">130-170ms</text>
  <text x="426" y="263" text-anchor="middle" fill="#94a3b8" font-size="11">自建 DERP</text>
  <text x="426" y="277" text-anchor="middle" fill="#64748b" font-size="10">香港 VPS</text>

  <!-- bar 3: Aliyun 34ms → ~9.5px -->
  <rect x="536" y="235" width="100" height="10" fill="url(#barGreen)" rx="4"/>
  <text x="586" y="230" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">34ms</text>
  <text x="586" y="263" text-anchor="middle" fill="#94a3b8" font-size="11">自建 DERP</text>
  <text x="586" y="277" text-anchor="middle" fill="#64748b" font-size="10">阿里云深圳</text>

  <!-- Improvement arrows -->
  <text x="350" y="97" text-anchor="middle" fill="#475569" font-size="16">→</text>
  <text x="510" y="223" text-anchor="middle" fill="#475569" font-size="16">→</text>

  <!-- Improvement labels -->
  <rect x="318" y="84" width="64" height="18" fill="#161b27" rx="4"/>
  <text x="350" y="97" text-anchor="middle" fill="#f59e0b" font-size="10">↓ 80%</text>
  <rect x="478" y="210" width="64" height="18" fill="#161b27" rx="4"/>
  <text x="510" y="223" text-anchor="middle" fill="#10b981" font-size="10">↓ 96%</text>
</svg>
